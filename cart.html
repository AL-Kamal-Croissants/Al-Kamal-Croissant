
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - Al Kamal Croissant</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="cart-page">


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav>

        <div class="logo">
            Al Kamal Croissant
        </div>


        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="menu.html">
                    Items
                </a>
            </li>

            <li>
                <a href="about.html">
                    About
                </a>
            </li>

            <li>
                <a href="cart.html" class="active">

                    🛒 Cart

                    <span id="cart-count">
                        0
                    </span>

                </a>
            </li>

        </ul>

    </nav>



    <!-- =========================
         CART SECTION
    ========================== -->

    <section class="cart-section">


        <h1>
            Your Cart 🛒
        </h1>


        <!-- CART ITEMS -->

        <div id="cart-items"></div>


        <!-- TOTAL -->

        <div class="cart-total">

            <h2>

                Total:

                <span id="cart-total">
                    0 L.L
                </span>

            </h2>

        </div>



        <!-- =========================
             COMPLETE ORDER BUTTON
        ========================== -->

        <div class="complete-order-container">

            <button
                class="complete-order"
                onclick="showCustomerForm()">

                Complete Your Order

            </button>

        </div>



        <!-- =========================
             CUSTOMER FORM
        ========================== -->

        <div
            class="customer-form"
            id="customer-form"
            style="display: none;">

            <h2>
                Customer Information
            </h2>


            <!-- NAME -->

            <input
                type="text"
                id="customer-name"
                placeholder="الاسم">



            <!-- =========================
                 DELIVERY / PICKUP
            ========================== -->

            <div class="order-type">

                <button
                    type="button"
                    class="order-type-btn"
                    id="delivery-btn"
                    onclick="selectOrderType('Delivery')">

                    Delivery

                </button>


                <button 
    type="button" 
    class="order-type-btn" 
    id="Takeaway-btn" 
    onclick="selectOrderType('Takeaway')">
    Takeaway
</button>

            </div>



            <!-- =========================
                 ADDRESS
                 ONLY FOR DELIVERY
            ========================== -->

            <input
                type="text"
                id="customer-address"
                placeholder="العنوان"
                style="display: none;">



            <!-- =========================
                 NOTES
                 ALWAYS VISIBLE
            ========================== -->

            <input
                type="text"
                id="customer-notes"
                placeholder="الملاحظات (اختياري)">



            <!-- =========================
                 SEND ORDER
            ========================== -->

            <button
                class="place-order"
                onclick="placeOrder()">

                Done & Send Order to WhatsApp

            </button>

        </div>

    </section>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 Al Kamal Croissant.
        </p>

    </footer>



    <!-- JAVASCRIPT -->

    <script src="cart.js"></script>


</body>

</html>
